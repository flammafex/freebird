# Include inside nginx's http {} context. Replace the two example DNS names
# and matching certificate paths before deployment. No forwarded headers trusted.
# Copy only demo/web/dist/ contents to /var/www/freebird-demo; configure its
# freebird-issuer meta tag and the CSP Issuer origin below (including any port).
limit_req_zone $binary_remote_addr zone=freebird_pow:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=freebird_app:10m rate=60r/m;
log_format freebird_minimal '$server_name $request_method $status $body_bytes_sent';
access_log /var/log/nginx/freebird-access.log freebird_minimal;
error_log /var/log/nginx/freebird-error.log warn;

server {
    listen 80;
    listen [::]:80;
    server_name issuer.example.org;
    if ($http_host !~* "^issuer\.example\.org(:80)?$") { return 421; }
    client_max_body_size 1k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;

    location ^~ /.well-known/acme-challenge/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        if ($request_uri != $uri) { return 404; }
        root /var/lib/letsencrypt;
        try_files $uri =404;
    }
    location = /.well-known/private-token-issuer-directory {
        if ($request_uri != "/.well-known/private-token-issuer-directory") { return 404; }
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        return 308 https://issuer.example.org/.well-known/private-token-issuer-directory;
    }
    location = /private-token/issue {
        if ($request_uri != "/private-token/issue") { return 404; }
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        return 308 https://issuer.example.org/private-token/issue;
    }
    location / { return 404; }
}

server {
    listen 80;
    listen [::]:80;
    server_name origin.example.org;
    if ($http_host !~* "^origin\.example\.org(:80)?$") { return 421; }
    client_max_body_size 1k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;

    location ^~ /.well-known/acme-challenge/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        if ($request_uri != $uri) { return 404; }
        root /var/lib/letsencrypt;
        try_files $uri =404;
    }
    location = /private-token/protected {
        if ($request_uri != "/private-token/protected") { return 404; }
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        return 308 https://origin.example.org/private-token/protected;
    }
    location / { return 404; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name issuer.example.org;
    ssl_certificate /etc/letsencrypt/live/issuer.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/issuer.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_early_data off;
    if ($http_host !~* "^issuer\.example\.org(:443)?$") { return 421; }
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 15s;

    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    proxy_request_buffering on;
    proxy_buffering on;
    proxy_cache off;
    proxy_store off;
    proxy_next_upstream off;
    proxy_pass_request_headers off;
    proxy_set_header Host issuer.example.org;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Freebird-Admission $http_freebird_admission;
    # Explicit browser CORS allowlist; the Issuer validates the exact Origin.
    proxy_set_header Origin $http_origin;
    proxy_set_header Access-Control-Request-Method $http_access_control_request_method;
    proxy_set_header Access-Control-Request-Headers $http_access_control_request_headers;
    proxy_set_header Connection close;

    location = /.well-known/private-token-issuer-directory {
        if ($request_uri != "/.well-known/private-token-issuer-directory") { return 404; }
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        proxy_pass http://127.0.0.1:8081;
    }
    location = /private-token/issue {
        if ($request_uri != "/private-token/issue") { return 404; }
        if ($request_method !~ ^(POST|OPTIONS)$) { return 405; }
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8081;
    }
    location ^~ /freebird/pow/ {
        if ($request_uri != $uri) { return 404; }
        if ($request_method !~ ^(GET|POST|OPTIONS)$) { return 405; }
        client_max_body_size 8k;
        limit_req zone=freebird_pow burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8081;
    }
    # Server-to-server application admission: POST only, no body, no CORS.
    location = /freebird/app/admission {
        if ($request_uri != "/freebird/app/admission") { return 404; }
        if ($request_method != POST) { return 405; }
        client_max_body_size 1k;
        limit_req zone=freebird_app burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8081;
    }
    location / { return 404; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name origin.example.org;
    ssl_certificate /etc/letsencrypt/live/origin.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/origin.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_early_data off;
    if ($http_host !~* "^origin\.example\.org(:443)?$") { return 421; }
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 15s;

    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    proxy_request_buffering on;
    proxy_buffering on;
    proxy_cache off;
    proxy_store off;
    proxy_next_upstream off;
    proxy_pass_request_headers off;
    proxy_set_header Host origin.example.org;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Freebird-Admission $http_freebird_admission;
    proxy_set_header Connection close;

    location = /private-token/protected {
        if ($request_uri != "/private-token/protected") { return 404; }
        if ($request_method != GET) { return 405; }
        proxy_pass http://127.0.0.1:8082;
    }
    location / {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        root /var/www/freebird-demo;
        index index.html;
        try_files $uri $uri/ =404;
        # Explicit types also work when the enclosing http has no mime.types.
        types {
            text/html html;
            text/css css;
            application/javascript js mjs;
            image/svg+xml svg;
            text/plain txt;
            application/json json;
        }
        default_type application/octet-stream;
        # Location headers replace inherited headers, so repeat HSTS.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self'; connect-src 'self' https://issuer.example.org; worker-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
    }
}

# Application protection (optional). Paste these locations into an application
