name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo test -p integration_tests --test sybil_http_matrix
      - run: cargo test -p integration_tests --test admin_operator_workflows

  feature-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p freebird-interface

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit --ignore RUSTSEC-2023-0071

  javascript-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: sdk/js/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Build SDK and declarations
        run: npm run build
      - name: Run complete SDK test suite
        run: npm test -- --run
      - name: Dry-run SDK package
        run: npm pack --dry-run --json
      - name: Verify packed ESM, CJS, and declaration consumers
        run: |
          set -euo pipefail
          consumer_dir="$(mktemp -d)"
          pack_dir="$(mktemp -d)"
          trap 'rm -rf "$consumer_dir" "$pack_dir"' EXIT
          pack_json="$(npm pack --ignore-scripts --json --pack-destination "$pack_dir")"
          tarball="$(PACK_JSON="$pack_json" node -e 'const entries = JSON.parse(process.env.PACK_JSON); if (entries.length !== 1) process.exit(1); process.stdout.write(entries[0].filename);')"
          cd "$consumer_dir"
          npm init --yes --ignore-scripts >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "$pack_dir/$tarball" typescript@^5 >/dev/null
          cp "$GITHUB_WORKSPACE/sdk/js/tests/package-consumers/esm-consumer.mts" .
          cp "$GITHUB_WORKSPACE/sdk/js/tests/package-consumers/cjs-consumer.cts" .
          cp "$GITHUB_WORKSPACE/sdk/js/tests/package-consumers/tsconfig.esm.json" .
          cp "$GITHUB_WORKSPACE/sdk/js/tests/package-consumers/tsconfig.cjs.json" .
          ./node_modules/.bin/tsc --project tsconfig.esm.json
          ./node_modules/.bin/tsc --project tsconfig.cjs.json
          node --input-type=module --eval "import * as sdk from '@flammafex/freebird'; if (typeof sdk.FreebirdClient !== 'function') throw new Error('ESM entry point failed')"
          node --eval "const sdk = require('@flammafex/freebird'); if (typeof sdk.FreebirdClient !== 'function') throw new Error('CJS entry point failed')"
      - name: Start SDK integration services
        working-directory: .
        run: |
          cp .env.example .env
          sed -i 's/^ADMIN_API_KEY=.*/ADMIN_API_KEY=ci-sdk-test-key-at-least-32-chars/' .env
          sed -i 's/^SYBIL_RESISTANCE=.*/SYBIL_RESISTANCE=none/' .env
          sed -i 's/^NATIVE_BEARER_V7_TOKEN_KEY_ID=.*/NATIVE_BEARER_V7_TOKEN_KEY_ID=3d7a1f9c5e2b8d604a6c0f3e7b1d9a5c2f8e4b0d6a1c7e3f9b5d2a8c4e0f6b1b/' .env
          docker compose up -d --build --wait
      - name: Run SDK tests
        env:
          FREEBIRD_SDK_ISSUER_URL: http://127.0.0.1:8081
          FREEBIRD_SDK_VERIFIER_URL: http://127.0.0.1:8082
        run: npm test -- --run
      - name: Tear down SDK integration services
        if: always()
        working-directory: .
        run: docker compose down -v

  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: bash -n scripts/*.sh
      - name: Run backup D6 parser and shell suites
        run: |
          python3 scripts/test-backup-archive.py
          bash scripts/test-backup-restore.sh
      - name: Run release gate tests without source-tree bytecode
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          TMPDIR="$tmp" PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-release-gate.py
      - name: Validate documentation links and profile matrix
        run: python3 scripts/ci-static-checks.py
      - name: Validate JSON manifests
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in (Path("sdk/js/package.json"), Path("sdk/js/package-lock.json")):
              json.loads(path.read_text(encoding="utf-8"))
              print(f"valid JSON: {path}")
          PY
      - name: Validate YAML manifests
        run: |
          git ls-files -z '*.yml' '*.yaml' | xargs -0 ruby -e 'require "yaml"; ARGV.each { |path| YAML.load_file(path); puts "valid YAML: #{path}" }'
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.7

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure .env for smoke test
        run: |
          cp .env.example .env
          # Override dev defaults that would block startup
          sed -i 's/^ADMIN_API_KEY=.*/ADMIN_API_KEY=ci-smoke-test-key-at-least-32-chars/' .env
          sed -i 's/^SYBIL_RESISTANCE=.*/SYBIL_RESISTANCE=none/' .env
          sed -i 's/^NATIVE_BEARER_V7_TOKEN_KEY_ID=.*/NATIVE_BEARER_V7_TOKEN_KEY_ID=3d7a1f9c5e2b8d604a6c0f3e7b1d9a5c2f8e4b0d6a1c7e3f9b5d2a8c4e0f6b1b/' .env
      - name: Build and start services
        run: docker compose up -d --build --wait
      - name: Verify well-known endpoints
        run: |
          curl -sf http://127.0.0.1:8081/.well-known/issuer | jq -e '.issuer_id'
          curl -sf http://127.0.0.1:8082/.well-known/verifier | jq -e '.verifier_id'
          curl -sf http://127.0.0.1:8082/health | jq -e '.status'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run interface round-trip
        run: |
          cargo run -p freebird-interface -- \
            --issuer-url http://127.0.0.1:8081 \
            --verifier-url http://127.0.0.1:8082
      - name: Tear down
        if: always()
        run: docker compose down -v
