name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  interop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: interop/go/go.sum
      - run: cargo build --locked -p freebird-privacy-pass-service --bin freebird-privacy-pass-service
      - run: npm ci --ignore-scripts
        working-directory: interop/ts
      - run: go mod download
        working-directory: interop/go
      - run: node --test
        working-directory: interop/ts
      - run: go test ./...
        working-directory: interop/go
      - run: python3 scripts/test-interop.py
      - run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-live-provision.py
      - run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-app-admission.py
      - run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-recovery.py

  deployment-proxy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y nginx openssl curl
      - run: cargo build --locked -p freebird-privacy-pass-service --bin freebird-privacy-pass-service --example loopback_client
      - name: Exercise TLS deployment proxy
        run: python3 scripts/test-deployment-proxy.py
        env:
          FREEBIRD_NGINX: /usr/sbin/nginx

  browser-demo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: sudo apt-get update && sudo apt-get install -y nginx openssl
      - run: cargo build --locked -p freebird-privacy-pass-service --bin freebird-privacy-pass-service
      - name: PoW admission against the real Issuer
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-pow.py
      - name: Headless Chrome through nginx TLS (installs pinned demo deps)
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-browser-demo.py
        env:
          FREEBIRD_NGINX: /usr/sbin/nginx
          FREEBIRD_CHROME: /usr/bin/google-chrome
      - name: Demo helper tests
        run: node --test test/helpers.test.mjs
        working-directory: demo/web

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --workspace
      - name: Check independent external crypto consumer
        run: python3 scripts/check-external-consumer.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test workspace including service reference client
        run: |
          cargo build --locked -p freebird-privacy-pass-service --example loopback_client
          cargo test --locked --workspace

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check local links, fixture provenance, and release hold
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci-static-checks.py
      - name: Check external recovery catalog refusal
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-recovery-catalog.py
      - name: Validate workflow YAML
        run: ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].each { |path| YAML.load_file(path) }'
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.7
