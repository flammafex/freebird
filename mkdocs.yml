site_name: Freebird
site_description: Self-hostable privacy-preserving token issuance and verification for civil-society web services
site_url: https://freebird.bot

docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.highlight
    - search.suggest
    - search.share
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Use light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Quick Start: quick-start.md
  - Concepts:
      - concepts/index.md
      - Issuers: concepts/issuers.md
      - Verifiers: concepts/verifiers.md
      - Tokens: concepts/tokens.md
      - One-Time Redemption: concepts/one-time-redemption.md
      - Replay Protection: concepts/replay-protection.md
      - Federation: concepts/federation.md
      - WebAuthn Issuance: concepts/webauthn-issuance.md
      - Blind Issuance: concepts/blind-issuance.md
  - Architecture:
      - architecture/index.md
      - Protocol Overview: architecture/protocol-overview.md
      - Trust Boundaries: architecture/trust-boundaries.md
      - Data Flow: architecture/data-flow.md
      - Storage Model: architecture/storage-model.md
      - Deployment Modes: architecture/deployment-modes.md
  - Security:
      - security/index.md
      - Threat Model: security/threat-model.md
      - Privacy Properties: security/privacy-properties.md
      - Non-Goals: security/non-goals.md
      - Cryptographic Assumptions: security/cryptographic-assumptions.md
      - Audit Status: security/audit-status.md
  - API:
      - api/index.md
      - HTTP API: api/http-api.md
      - TypeScript SDK: api/typescript-sdk.md
      - CLI: api/cli.md
      - Configuration: api/configuration.md
  - Guides:
      - guides/index.md
      - Anonymous Feedback: guides/anonymous-feedback.md
      - Token-Gated Community: guides/token-gated-community.md
      - Public Wi-Fi Pass: guides/public-wifi-pass.md
      - Witness Integration: guides/witness-integration.md
  - Roadmap: roadmap.md
  - Grant Work Packages: grant-work-packages.md
  - Contributing: contributing.md
  - License: license.md
