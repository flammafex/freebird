[package]
name = "freebird-crypto"
version = "0.11.0"
edition = "2021"
publish = false
description = "Experimental RFC 9474 blind-RSA adapter for Privacy Pass"
license = "MIT OR Apache-2.0"
repository = "https://github.com/flammafex/freebird"
homepage = "https://github.com/flammafex/freebird"
keywords = ["cryptography", "privacy-pass", "privacy", "authentication"]
categories = ["cryptography", "authentication"]

[dependencies]
blind-rsa-signatures = { package = "blind-rsa-signatures", git = "https://github.com/kixel-ai/rind", rev = "13f6c4565d2ac0c7a4488eba35933b2ca85ff317", default-features = false }
rsa = { version = "=0.10.0", default-features = false }
sha2 = "0.10"

[dev-dependencies]
base64ct = { version = "1.8", features = ["alloc"] }
serde_json = "1"
