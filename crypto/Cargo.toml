[package]
name = "freebird-crypto"
version = "0.11.0"
edition = "2021"
publish = false
description = "Experimental RFC 9474 blind-RSA adapter for Privacy Pass"
license = "MIT OR Apache-2.0"
repository = "https://github.com/flammafex/freebird"
homepage = "https://github.com/flammafex/freebird"
keywords = ["cryptography", "privacy-pass", "privacy", "authentication"]
categories = ["cryptography", "authentication"]

[dependencies]
blind-rsa-signatures = { version = "=0.18.0", default-features = false }
# Upstream's prerelease range also admits incompatible rsa 0.10.0 stable.
rsa = { version = "=0.10.0-rc.18", default-features = false }
pkcs1 = { version = "=0.8.0-rc.4", default-features = false }
sha2 = "0.10"

[dev-dependencies]
base64ct = { version = "1.8", features = ["alloc"] }
serde_json = "1"
