[package]
name = "freebird-common"
version = "0.11.0"
edition = "2021"
publish = false
description = "Experimental RFC 9577/9578 Privacy Pass wire codec"
license = "MIT OR Apache-2.0"
repository = "https://github.com/flammafex/freebird"
homepage = "https://github.com/flammafex/freebird"
keywords = ["privacy-pass", "authorization", "tokens"]
categories = ["authentication"]

[dependencies]
base64ct = { version = "1.6", features = ["alloc"] }
sha2 = "0.10"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
serde_json = "1"
hex = "0.4"
