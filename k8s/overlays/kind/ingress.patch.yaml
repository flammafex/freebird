apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: issuer-ingress
  namespace: freebird
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts: [issuer.freebird.test]
      secretName: issuer-tls-cert
  rules:
    - host: issuer.freebird.test
      http:
        paths:
          - path: /.well-known/issuer
            pathType: Exact
            backend: {service: {name: issuer, port: {number: 8081}}}
          - path: /.well-known/keys
            pathType: Exact
            backend: {service: {name: issuer, port: {number: 8081}}}
          - path: /healthz
            pathType: Exact
            backend: {service: {name: issuer, port: {number: 8081}}}
          - path: /readyz
            pathType: Exact
            backend: {service: {name: issuer, port: {number: 8081}}}
          - path: /v1/oprf
            pathType: Prefix
            backend: {service: {name: issuer, port: {number: 8081}}}
          - path: /v1/public
            pathType: Prefix
            backend: {service: {name: issuer, port: {number: 8081}}}
          - path: /v1/public/graph/replay-authority/probe
            pathType: Exact
            backend: {service: {name: issuer, port: {number: 8081}}}
          - path: /webauthn
            pathType: Prefix
            backend: {service: {name: issuer, port: {number: 8081}}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: issuer-admin-ingress
  namespace: freebird
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/whitelist-source-range: "0.0.0.0/32"
spec:
  tls: []
  rules:
    - host: issuer-admin.freebird.test
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: verifier-ingress
  namespace: freebird
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  tls: []
  rules:
    - host: verifier.freebird.test
      http:
        paths:
          - path: /health
            pathType: Exact
            backend: {service: {name: verifier, port: {number: 8082}}}
          - path: /ready
            pathType: Exact
            backend: {service: {name: verifier, port: {number: 8082}}}
          - path: /.well-known/verifier
            pathType: Exact
            backend: {service: {name: verifier, port: {number: 8082}}}
          - path: /v1/verify
            pathType: Exact
            backend: {service: {name: verifier, port: {number: 8082}}}
          - path: /v1/verify/batch
            pathType: Exact
            backend: {service: {name: verifier, port: {number: 8082}}}
          - path: /v1/check
            pathType: Exact
            backend: {service: {name: verifier, port: {number: 8082}}}
