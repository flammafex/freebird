apiVersion: apps/v1
kind: Deployment
metadata:
  name: issuer
  namespace: freebird
spec:
  template:
    spec:
      containers:
        - name: issuer
          readinessProbe:
            exec:
              command: ["sh", "-c", "curl -fsS --connect-to issuer.freebird.test:443:ingress-nginx-controller.ingress-nginx.svc.cluster.local:443 https://issuer.freebird.test/readyz"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verifier
  namespace: freebird
spec:
  template:
    spec:
      containers:
        - name: verifier
          readinessProbe:
            exec:
              command: ["sh", "-c", "curl -fsS --connect-to verifier.freebird.test:80:ingress-nginx-controller.ingress-nginx.svc.cluster.local:80 http://verifier.freebird.test/ready"]
