apiVersion: v1
kind: ConfigMap
metadata:
  name: issuer-config
  namespace: freebird
data:
  # Replace every REQUIRED_* value before applying this overlay.
  TRUSTED_PROXY_CIDRS: "REQUIRED_INGRESS_SOURCE_CIDR"
  # Set this to the same value in issuer and verifier. Use true only after
  # installing the V2 graph/policy/signer files and completing the preflight.
  PUBLIC_BEARER_EXCHANGE_ENABLE: "REQUIRED_GRAPH_ISSUANCE_EXCHANGE_ENABLED"
  PUBLIC_BEARER_GRAPH_ISSUANCE_ENABLE: "REQUIRED_GRAPH_ISSUANCE_ENABLED"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: verifier-config
  namespace: freebird
data:
  TRUSTED_PROXY_CIDRS: "REQUIRED_INGRESS_SOURCE_CIDR"
  ISSUER_URL: "https://REQUIRED_PUBLIC_ISSUER_HOST/.well-known/issuer"
  # Set the marker to the same value as issuer. For graph issuance, replace
  # the URL marker with the issuer's public HTTPS URL; otherwise replace it
  # with an empty value.
  PUBLIC_BEARER_GRAPH_ISSUANCE_ENABLE: "REQUIRED_GRAPH_ISSUANCE_ENABLED"
  VERIFIER_GRAPH_ISSUANCE_ISSUER_URLS: "REQUIRED_GRAPH_ISSUANCE_ISSUER_URLS"
