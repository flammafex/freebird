apiVersion: v1
kind: ConfigMap
metadata:
  name: issuer-config
  namespace: freebird
data:
  RUST_LOG: "info,freebird=debug"
  BIND_ADDR: "0.0.0.0:8081"
  # Values that identify the trusted proxy are supplied by an overlay.
  REQUIRE_TLS: "true"
  BEHIND_PROXY: "true"
  ISSUER_ID: "issuer:k8s:v4"
  EPOCH_DURATION: "1d"
  EPOCH_RETENTION: "2"
  SYBIL_RESISTANCE: "invitation"
  SYBIL_REPLAY_STORE: "redis"
  SYBIL_INVITE_PER_USER: "5"
  SYBIL_INVITE_COOLDOWN: "1h"
  SYBIL_INVITE_EXPIRES: "30d"
  SYBIL_INVITE_AUTOSAVE_INTERVAL: "5m"
  SYBIL_INVITE_BOOTSTRAP_USERS: "admin:100"
  NATIVE_BEARER_V7_ENABLE: "true"
  NATIVE_BEARER_V7_SK_PATH: "/data/keys/native_bearer_v7.der"
  NATIVE_BEARER_V7_METADATA_PATH: "/data/config/native_bearer_v7.json"
  NATIVE_BEARER_V7_REGISTRY_PATH: "/data/config/native_bearer_v7_registry.json"
  NATIVE_BEARER_V7_PROFILE_ID: "scarcity/native-bearer/v7"
  NATIVE_BEARER_V7_ASSET_ID: "USD"
  NATIVE_BEARER_V7_AMOUNT_MINOR: "1"
  NATIVE_BEARER_V7_VALIDITY: "30d"
  # V7 exchange/graph issuance are opt-in. When enabled, provision all
  # referenced discovery, history, acknowledgement, receipt, policy, and
  # signer files.
  NATIVE_EXCHANGE_V7_ENABLE: "false"
  NATIVE_EXCHANGE_V7_DISCOVERY_PATH: "/data/config/native-exchange-v7-discovery.json"
  NATIVE_EXCHANGE_V7_RETAINED_DISCOVERY_PATHS: ""
  NATIVE_EXCHANGE_V7_PUBLIC_HISTORY_PATH: "/data/config/native-exchange-v7-history.json"
  NATIVE_EXCHANGE_V7_DISABLED_PUBLICATION_ACK_PATHS: ""
  NATIVE_EXCHANGE_V7_ACTIVE_RECEIPT_KEY_PATH: "/data/keys/native-exchange-v7-receipt.key"
  NATIVE_EXCHANGE_V7_ACTIVE_RECEIPT_METADATA_PATH: "/data/config/native-exchange-v7-receipt.json"
  NATIVE_EXCHANGE_V7_RETAINED_RECEIPT_KEY_PATHS: ""
  NATIVE_EXCHANGE_V7_RETAINED_RECEIPT_METADATA_PATHS: ""
  NATIVE_EXCHANGE_V7_RECEIPT_LIFETIME: "1d"
  NATIVE_EXCHANGE_V7_MAX_BODY_BYTES: "3145728"
  NATIVE_EXCHANGE_V7_TIMEOUT: "30s"
  NATIVE_GRAPH_ISSUANCE_V7_ENABLE: "false"
  NATIVE_GRAPH_ISSUANCE_V7_POLICY_PATH: "/data/config/native-graph-issuance-v7-discovery.json"
  NATIVE_GRAPH_ISSUANCE_V7_AUTHORIZATION: "v4_local"
  NATIVE_GRAPH_ISSUANCE_V7_VERIFIER_ID: "verifier:k8s:v4"
  NATIVE_GRAPH_ISSUANCE_V7_AUDIENCE: "freebird-native-graph-v7"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: issuer-data
  namespace: freebird
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: issuer
  namespace: freebird
  labels:
    app: freebird
    component: issuer
spec:
  replicas: 1  # Issuer must be singleton to maintain key consistency
  strategy:
    type: Recreate  # Avoid simultaneous instances
  selector:
    matchLabels:
      app: freebird
      component: issuer
  template:
    metadata:
      labels:
        app: freebird
        component: issuer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/admin/metrics"
    spec:
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      # Init containers for setup
      initContainers:
        - name: setup
          # Production must replace this sentinel with the operator-verified
          # release image digest. The kind overlay substitutes a local smoke
          # image and the smoke script then loads the requested test image.
          image: ghcr.io/flammafex/freebird-issuer@sha256:REQUIRED_ISSUER_IMAGE_DIGEST
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
             - mkdir -p /data/keys /data/state /data/config && chmod 750 /data/*
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false

      # Main containers
      containers:
        - name: issuer
          image: ghcr.io/flammafex/freebird-issuer@sha256:REQUIRED_ISSUER_IMAGE_DIGEST
          imagePullPolicy: IfNotPresent

          # Environment
          envFrom:
            - configMapRef:
                name: issuer-config
          env:
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: admin-credentials
                  key: admin-api-key
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: password
            - name: REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@redis:6379
            - name: SYBIL_REPLAY_REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@redis:6379
            - name: WEBAUTHN_REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@redis:6379
            - name: ISSUER_SK_PATH
              value: /data/keys/issuer_sk.bin
            - name: KEY_ROTATION_STATE_PATH
              value: /data/keys/key_rotation_state.json
            - name: SYBIL_INVITE_PERSISTENCE_PATH
              value: /data/state/invitations.json
            - name: SYBIL_INVITE_SIGNING_KEY_PATH
              value: /data/keys/invitation_signing_key.bin
            - name: NATIVE_EXCHANGE_V7_REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@redis:6379
            - name: NATIVE_BEARER_V7_DESCRIPTOR_ID
              valueFrom:
                secretKeyRef:
                  name: native-bearer-v7-credentials
                  key: descriptor-id
            - name: NATIVE_BEARER_V7_TOKEN_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: native-bearer-v7-credentials
                  key: token-key-id
            - name: NATIVE_GRAPH_ISSUANCE_V7_V4_KEYRING_B64
              valueFrom:
                secretKeyRef:
                  name: graph-issuance-credentials
                  key: v4-keyring-b64
                  optional: true
            - name: WEBAUTHN_PROOF_SECRET
              valueFrom:
                secretKeyRef:
                  name: webauthn-credentials
                  key: proof-secret
                  optional: true

          # Ports
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP

          # Liveness is process-local; readiness checks the proxy boundary.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          readinessProbe:
            exec:
              command: ["sh", "-c", "curl -fsS --connect-to freebird.invalid:443:proxy-service.proxy-namespace.svc.cluster.local:443 https://freebird.invalid/readyz"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2

          # Startup probe for slow starting containers
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30

          # Resource management
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "2000m"

          # Volume mounts
          volumeMounts:
            - name: data
              mountPath: /data

          # Security context for container
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
            readOnlyRootFilesystem: false

          # Graceful shutdown
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]

      # Pod-level configuration
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: issuer-data

      # Affinity rules
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - freebird
                topologyKey: kubernetes.io/hostname

      # DNS policy
      dnsPolicy: ClusterFirst
      serviceAccountName: freebird-issuer

      # Termination grace period for graceful shutdown
      terminationGracePeriodSeconds: 45

---
apiVersion: v1
kind: Service
metadata:
  name: issuer
  namespace: freebird
  labels:
    app: freebird
    component: issuer
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: freebird
    component: issuer

---
apiVersion: v1
kind: Service
metadata:
  name: issuer-probe
  namespace: freebird
  labels:
    app: freebird
    component: issuer
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  ports:
    - port: 8081
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: freebird
    component: issuer

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: issuer-pdb
  namespace: freebird
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: freebird
      component: issuer
