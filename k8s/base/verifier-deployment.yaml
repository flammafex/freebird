apiVersion: v1
kind: ConfigMap
metadata:
  name: verifier-config
  namespace: freebird
data:
  RUST_LOG: "info,freebird=debug"
  BIND_ADDR: "0.0.0.0:8082"
  # Values that identify the trusted proxy are supplied by an overlay.
  REQUIRE_TLS: "true"
  BEHIND_PROXY: "true"
  ISSUER_URL: "https://issuer.invalid/.well-known/issuer"
  VERIFIER_ID: "verifier:k8s:v4"
  VERIFIER_AUDIENCE: "k8s"
  VERIFIER_ACCEPTED_TOKEN_VERSIONS: "v4,v5"
  VERIFIER_ENV: "production"
  IN_MEMORY_REPLAY_STORE: "false"
  REFRESH_INTERVAL_MIN: "10"
  # This coordination marker must match the issuer when graph issuance is
  # enabled. Leave it false with an empty authority URL otherwise.
  PUBLIC_BEARER_GRAPH_ISSUANCE_ENABLE: "false"
  # Leave empty unless this verifier participates in V2 graph issuance.
  VERIFIER_GRAPH_ISSUANCE_ISSUER_URLS: ""
  VERIFIER_REPLAY_AUTHORITY_PROBE_INTERVAL: "30s"
  VERIFIER_REPLAY_AUTHORITY_MAX_STALENESS: "60s"
  EPOCH_DURATION_SEC: "86400"
  EPOCH_RETENTION: "2"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verifier
  namespace: freebird
  labels:
    app: freebird
    component: verifier
spec:
  replicas: 3  # Verifiers are stateless and can scale
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: freebird
      component: verifier
  template:
    metadata:
      labels:
        app: freebird
        component: verifier
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/admin/metrics"
    spec:
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      # Main containers
      containers:
        - name: verifier
          image: ghcr.io/flammafex/freebird-verifier@sha256:REQUIRED_VERIFIER_IMAGE_DIGEST
          imagePullPolicy: IfNotPresent

          # Environment
          envFrom:
            - configMapRef:
                name: verifier-config
          env:
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: admin-credentials
                  key: admin-api-key
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: password
            - name: REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@redis:6379
            - name: VERIFIER_SK_B64
              valueFrom:
                secretKeyRef:
                  name: verifier-keys
                  key: verifier-sk-b64

          # Ports
          ports:
            - name: http
              containerPort: 8082
              protocol: TCP

          # Liveness is process-local; readiness checks the proxy boundary.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          readinessProbe:
            exec:
              command: ["sh", "-c", "curl -fsS --connect-to freebird.invalid:443:proxy-service.proxy-namespace.svc.cluster.local:443 https://freebird.invalid/ready"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2

          # Startup probe
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30

          # Resource management
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "2000m"

          # Security context for container
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
            readOnlyRootFilesystem: false

          # Graceful shutdown
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]

      # Pod-level configuration
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                    - key: component
                      operator: In
                      values:
                        - verifier
                topologyKey: kubernetes.io/hostname

      # DNS policy
      dnsPolicy: ClusterFirst
      serviceAccountName: freebird-verifier

      # Termination grace period
      terminationGracePeriodSeconds: 45

---
apiVersion: v1
kind: Service
metadata:
  name: verifier
  namespace: freebird
  labels:
    app: freebird
    component: verifier
spec:
  type: ClusterIP
  sessionAffinity: None
  ports:
    - port: 8082
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: freebird
    component: verifier

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: verifier-pdb
  namespace: freebird
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: freebird
      component: verifier
