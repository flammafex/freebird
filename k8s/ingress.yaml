---
# Kubernetes Ingress for Freebird Issuer
# Requires ingress-nginx with the controller-level proxy-set-headers ConfigMap
# configured; see docs/deployment-kubernetes.md. Hosts and source CIDRs are
# overlay values.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: issuer-ingress
  namespace: freebird
  labels:
    app: freebird
    component: issuer
  annotations:
    # Nginx-specific annotations
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    # Rate limiting per issuer endpoints
    nginx.ingress.kubernetes.io/limit-rps: "50"
    # TLS
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - issuer.invalid
      secretName: issuer-tls-cert
  rules:
    - host: issuer.invalid
      http:
        paths:
          - path: /.well-known/issuer
            pathType: Exact
            backend:
              service:
                name: issuer
                port:
                  number: 8081
          - path: /.well-known/keys
            pathType: Exact
            backend:
              service:
                name: issuer
                port:
                  number: 8081
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: issuer
                port:
                  number: 8081
          - path: /readyz
            pathType: Exact
            backend:
              service:
                name: issuer
                port:
                  number: 8081
          - path: /v1/oprf
            pathType: Prefix
            backend:
              service:
                name: issuer
                port:
                  number: 8081
          - path: /v1/public
            pathType: Prefix
            backend:
              service:
                name: issuer
                port:
                  number: 8081
          - path: /v1/public/graph/replay-authority/probe
            pathType: Exact
            backend:
              service:
                name: issuer
                port:
                  number: 8081
          - path: /webauthn
            pathType: Prefix
            backend:
              service:
                name: issuer
                port:
                  number: 8081

---
# Admin ingress for Freebird Issuer.
# Keep this on a private hostname or restrict it with an ingress allowlist.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: issuer-admin-ingress
  namespace: freebird
  labels:
    app: freebird
    component: issuer
    surface: admin
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/limit-rps: "5"
    nginx.ingress.kubernetes.io/whitelist-source-range: "REQUIRED_OPERATOR_CIDR"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - issuer-admin.invalid
      secretName: issuer-admin-tls-cert
  rules:
    - host: issuer-admin.invalid
      http:
        paths:
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: issuer
                port:
                  number: 8081

---
# Kubernetes Ingress for Freebird Verifier
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: verifier-ingress
  namespace: freebird
  labels:
    app: freebird
    component: verifier
  annotations:
    # Nginx-specific annotations
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    # Rate limiting for verifier (higher since it handles many requests)
    nginx.ingress.kubernetes.io/limit-rps: "100"
    # TLS
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - verifier.invalid
      secretName: verifier-tls-cert
  rules:
    - host: verifier.invalid
      http:
        paths:
          - path: /health
            pathType: Exact
            backend:
              service:
                name: verifier
                port:
                  number: 8082
          - path: /ready
            pathType: Exact
            backend:
              service:
                name: verifier
                port:
                  number: 8082
