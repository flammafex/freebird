[[bin]]
name = "token"
path = "fuzz_targets/token.rs"
test = false
doc = false
bench = false

[[bin]]
name = "token_challenge"
path = "fuzz_targets/token_challenge.rs"
test = false
doc = false
bench = false

[[bin]]
name = "authorization_header"
path = "fuzz_targets/authorization_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "public_key_spki"
path = "fuzz_targets/public_key_spki.rs"
test = false
doc = false
bench = false

[[bin]]
name = "secret_key_pkcs8"
