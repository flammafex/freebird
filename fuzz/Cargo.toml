[package]
name = "freebird-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
freebird-common = { path = "../common" }
freebird-crypto = { path = "../crypto" }

[[bin]]
name = "token_request"
path = "fuzz_targets/token_request.rs"
